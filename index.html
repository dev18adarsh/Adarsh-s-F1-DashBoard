<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('f1-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored || (prefersDark ? 'dark' : 'light')
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Real-time Formula One Analytics, Statistics & Insights."
    />
    <meta name="theme-color" content="#e10600" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adarsh's F1 Dashboard" />
    <meta
      property="og:description"
      content="Real-time Formula One Analytics, Statistics & Insights."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Adarsh's F1 Dashboard" />
    <meta
      name="twitter:description"
      content="Real-time Formula One Analytics, Statistics & Insights."
    />
    <title>Adarsh's F1 Dashboard</title>
  </head>

  </body>
</html>
